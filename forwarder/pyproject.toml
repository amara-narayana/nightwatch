[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwatch-forwarder"
version = "1.0.0"
description = "NIGHTWATCH Production Telemetry Forwarder and Receiver"
authors = [{ name = "NIGHTWATCH Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "cryptography>=42.0.0",
    "psutil>=6.0.0",
    "pywin32>=306; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
nightwatch-agent = "forwarder.agent.main:main"
nightwatch-receiver = "forwarder.receiver.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
